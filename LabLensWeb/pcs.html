<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LabLens — Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="main">
    <section id="page-pcs">
      <div class="banner">
        <div><h1><i class="fa fa-desktop" style="margin-right:10px"></i> Computer Management</h1><p>Track and manage lab computers and their statuses</p></div>
        <div class="banner-right">
          <input class="search-bar" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff;" placeholder="Search…" oninput="ft('pc-tb',this.value)">
          <button class="btn btn-outline" onclick="openAddPC()"><i class="fa fa-plus"></i> Add Computer</button>
        </div>
      </div>
      <div class="tabs" style="margin-bottom:0;">
        <div class="tab active" onclick="switchTab('pc','list',this)"><i class="fa fa-list"></i> List View</div>
        <div class="tab" onclick="switchTab('pc','grid',this)"><i class="fa fa-th-large"></i> Grid View</div>
      </div>
      <div class="card" id="pc-list-view">
        <table class="tbl"><thead><tr><th>PC ID</th><th>Lab</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="pc-tb"></tbody>
        </table>
      </div>
      <div class="card" id="pc-grid-view" style="display:none;">
        <div class="pc-grid" id="pc-grid-inner"></div>
      </div>
    </section>
  </main>
  <div id="modals-placeholder"></div>
  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
  <script>loadFragment('header-placeholder','header.html');loadFragment('footer-placeholder','footer.html');loadFragment('modals-placeholder','modals.html');document.addEventListener('DOMContentLoaded',()=>{renderPCs(DB.pcs);updateBadges();});</script>
</body>
</html>
