<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LabLens — Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="main">
    <section id="page-students">
      <div class="banner">
        <div><h1><i class="fa fa-user" style="margin-right:10px"></i> Student Management</h1><p>Manage student registrations and contact details</p></div>
        <div class="banner-right">
          <input class="search-bar" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff;" placeholder="Search students…" oninput="ft('s-tb',this.value)">
          <button class="btn btn-outline" onclick="openModal('m-add-student')"><i class="fa fa-plus"></i> Add Student</button>
        </div>
      </div>
      <div class="card">
        <table class="tbl"><thead><tr><th>Student Number</th><th>Full Name</th><th>Email Address</th><th>Actions</th></tr></thead>
        <tbody id="s-tb"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="modals-placeholder"></div>
  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
  <script>loadFragment('header-placeholder','header.html');loadFragment('footer-placeholder','footer.html');loadFragment('modals-placeholder','modals.html');document.addEventListener('DOMContentLoaded',()=>{renderStudents(DB.students);updateBadges();});</script>
</body>
</html>
